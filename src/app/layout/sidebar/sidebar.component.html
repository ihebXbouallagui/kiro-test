<div class="sidebar bg-white border-end shadow-sm" id="sidebar-wrapper">
  <div class="sidebar-heading d-flex align-items-center justify-content-center py-4 px-3 fs-4 fw-bold text-primary">
    <i class="fas fa-graduation-cap me-2"></i>
    EZ-Learning
  </div>

  <div class="list-group list-group-flush px-3">

    <a routerLink="/dashboard" routerLinkActive="active"
       class="list-group-item list-group-item-action px-4 py-3">
      <i class="fas fa-gauge-high me-3"></i> Dashboard
    </a>

    <a routerLink="/users" routerLinkActive="active"
       class="list-group-item list-group-item-action px-4 py-3">
      <i class="fas fa-users me-3"></i> Users
    </a>

    <a routerLink="/courses" routerLinkActive="active"
       class="list-group-item list-group-item-action px-4 py-3">
      <i class="fas fa-book-open me-3"></i> Courses
    </a>

    <a routerLink="/certifications" routerLinkActive="active"
       class="list-group-item list-group-item-action px-4 py-3">
      <i class="fas fa-certificate me-3"></i> Certifications
    </a>

    <a routerLink="/job-offers" routerLinkActive="active"
       class="list-group-item list-group-item-action px-4 py-3">
      <i class="fas fa-briefcase me-3"></i> Job Offers
    </a>

    <a routerLink="/packs" routerLinkActive="active"
       class="list-group-item list-group-item-action px-4 py-3">
      <i class="fas fa-layer-group me-3"></i> Packs & Communication
    </a>

    <a routerLink="/hackathon" routerLinkActive="active"
       class="list-group-item list-group-item-action px-4 py-3">
      <i class="fas fa-code me-3"></i> Hackathon
    </a>

    <a routerLink="/blog" routerLinkActive="active"
       class="list-group-item list-group-item-action px-4 py-3">
      <i class="fas fa-blog me-3"></i> Blog & Tickets
    </a>

    <div class="my-5"></div>

    <a (click)="logout()"
       class="list-group-item list-group-item-action text-danger px-4 py-3">
      <i class="fas fa-power-off me-3"></i> Logout
    </a>

  </div>
</div>
