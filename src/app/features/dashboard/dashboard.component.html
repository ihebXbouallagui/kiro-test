<script>
// Animation pour afficher progressivement les lignes du tableau "Activités récentes"
document.addEventListener('DOMContentLoaded', () => {
  const table = document.querySelector('.activity-table');
  if (table) {
    // Ajoute la classe 'loaded' après un petit délai pour déclencher la transition CSS
    setTimeout(() => {
      table.classList.add('loaded');
    }, 200);
  }

  // Animation des compteurs (si tu souhaites, sinon tu peux retirer)
  const counters = document.querySelectorAll('.counter');
  counters.forEach(counter => {
    const updateCount = () => {
      const target = +counter.getAttribute('data-target');
      const count = +counter.innerText;
      const increment = target / 200;
      if (count < target) {
        counter.innerText = Math.ceil(count + increment);
        setTimeout(updateCount, 10);
      } else {
        counter.innerText = target.toLocaleString();
      }
    };
    updateCount();
  });
});
</script>
